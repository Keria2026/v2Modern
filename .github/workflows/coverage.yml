name: Coverage
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/coverage.yml"
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.15.15"
          cache: false
      - uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: core-go115-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Run tests with coverage and preserve their exit status
        run: go test -timeout 15m -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: Core-coverage-${{ github.sha }}
          path: coverage.out
          if-no-files-found: error
