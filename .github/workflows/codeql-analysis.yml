name: CodeQL
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "**/*.go"
      - "desktop/src/**"
      - "desktop/package-lock.json"
      - ".github/workflows/codeql-analysis.yml"
  pull_request:
    branches: [master]
    paths:
      - "**/*.go"
      - "desktop/src/**"
      - "desktop/package-lock.json"
      - ".github/workflows/codeql-analysis.yml"
  schedule:
    - cron: "0 0 * * 1"
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        if: matrix.language == 'go'
        with:
          # Analysis tooling needs -buildvcs (Go >=1.18); application builds stay on 1.15.15.
          go-version: "1.26.1"
          cache: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Extract Go with the supported autobuild workflow
        if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@v4
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
